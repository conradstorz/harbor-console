# The edge. Publishes the tailnet address only (ADR 7, ADR 15). The API is
# loopback only; the page reads it there. `.env` beside this file is written
# by install.sh from the host's tailnet address and /etc/traefik/env.
services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=harbor
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=hpz440.ohr3023.org
      - --entrypoints.websecure.http.tls.domains[0].sans=*.hpz440.ohr3023.org
      - --entrypoints.traefik.address=:8081
      # Read-only API, gated by HTTP Basic Auth (ADR 16) via the router in
      # dynamic/api.yml -- not --api.insecure, which would serve it with no
      # auth at all to anything on the harbor network, not only to the
      # loopback-only host publish below.
      - --api=true
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:?set ACME_EMAIL in /etc/traefik/env}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53
      - --log.level=INFO
    ports:
      - "${TAILNET_ADDRESS:?the edge binds the tailnet address only}:80:80"
      - "${TAILNET_ADDRESS:?the edge binds the tailnet address only}:443:443"
      - "127.0.0.1:8081:8081"
    env_file:
      - /etc/traefik/env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
      # ADR 16: the htpasswd file dynamic/api.yml's auth middleware reads.
      # install.sh writes it before this container starts; a bind mount of a
      # path that does not yet exist becomes a directory, so order matters.
      - /etc/traefik/dashboard-users:/etc/traefik/dashboard-users:ro
    networks:
      - harbor
      # ADR 16: Portainer moved off `harbor` onto its own network so no
      # project container can reach its read-write Docker socket over the
      # bridge. Traefik joins both -- it is the trusted routing component,
      # not an untrusted workload -- and Portainer's own
      # `traefik.docker.network=admin` label tells Traefik which of its
      # networks to route that one backend over.
      - admin
    labels:
      harbor.kind: edge
      harbor.description: "Reverse proxy; every HTTPS route on this host"

volumes:
  letsencrypt:

networks:
  harbor:
    external: true
  admin:
    external: true
