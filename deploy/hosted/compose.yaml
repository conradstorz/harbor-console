# Host infrastructure that belongs to no project repo. Recreated from the
# `docker run` configuration found on 2026-09-18; the named volume
# `portainer_data` is reused, so Portainer keeps its state.
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      # ADR 16: `admin`, not `harbor`. Portainer holds a read-write Docker
      # socket -- equivalent to root on the host -- and `harbor` is the flat
      # network every routed project container now joins under ADR 15.
      # `admin` is its own network so no project container can reach
      # portainer:9000 by name at all, only Traefik (multi-homed on
      # purpose) can route to it.
      - admin
    labels:
      traefik.enable: "true"
      # Explicit, not left to Traefik's default of "every declared
      # entrypoint": without this, the router also answers on the plaintext
      # `traefik` entrypoint (:8081), reachable from `admin` with no TLS.
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.rule: Host(`portainer.hpz440.ohr3023.org`)
      traefik.http.services.portainer.loadbalancer.server.port: "9000"
      # Tells Traefik's Docker provider (default network: harbor) which of
      # this container's networks to actually connect over, since Portainer
      # is on `admin` and nothing else here is.
      traefik.docker.network: admin
      harbor.description: "Portainer"

  watchtower:
    # nicholas-fedor/watchtower, the maintained fork. containrrr/watchtower
    # was archived 2025-12-17 and its last image (v1.7.1, 2023) pins Docker
    # API 1.25, which Engine 29 refuses: from the 2026-10-08 upgrade until
    # 2026-10-21 it crash-looped on every start. The fork keeps the flags,
    # env vars and the com.centurylinklabs.watchtower.enable label, and
    # negotiates the API version. Pinned like Traefik; tests/test_deploy.py
    # guards the pin.
    image: nickfedor/watchtower:1.23.1
    container_name: watchtower
    restart: always
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      harbor.kind: internal
      harbor.description: "Watchtower, nightly image updates"

volumes:
  portainer_data:
    external: true

networks:
  admin:
    external: true
