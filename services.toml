# Harbor Console port ledger. Written by `harbor-console ports sync`.
# The authority on which project holds which (host, addr, port).
#
# Adopted 2026-09-01 from what was actually running on hpz440. Ports outside the
# 8100-8999 allocation band are grandfathered where they stand; nothing running is
# renumbered to tidy the band. ARM's 49152 sits inside the Linux ephemeral range
# (32768-60999) and should move when convenient.
#
# The band bounds only what `allocate` hands out when it has to choose a port for
# a project; it is not a rule about what a lease may hold. Several leases sit
# outside it and always have: 8080, 8000, 1883, 5743, 49152, and this repo's own
# page on 80. None of them is a mistake to be corrected into the band.
#
# Amended by hand 2026-09-02, then again the same day. `schminternet` was found
# holding 0.0.0.0:8090 -- a port this ledger had leased to harbor-console/web
# while believing it free, because that container was not running when the ledger
# was adopted. harbor-console/web was moved aside to 8100 on the incumbent-keeps-
# the-port rule the allocator itself applies.
#
# schminternet then moved itself to 8099, so the collision resolved on its own and
# the move was undone: harbor-console/web holds 8090 again, its original grant, and
# it is what is running on the host. schminternet is recorded on 8099 so the ledger
# stops believing that port is free. Its `granted` date is the day it was noticed,
# not the day it started listening, which is earlier and unknown.
#
# Amended by hand again 2026-09-03: harbor-console/web moved from 8090 to 80, so
# the page is reached at http://hpz440/ with no port to remember. Nothing held 80
# on the host; the unit grants that one unprivileged service CAP_NET_BIND_SERVICE
# so it may bind a port below 1024. `granted` is the day of the move, not the day
# of the original grant, because the lease's key changed -- which is what
# `apply_decisions` does when a key moves, and the old date would have overstated
# this lease's tenure on 80.
#
# Every one of these amendments was by hand because `ports sync` cannot verify
# host state without /ports.json, which is served by the very service that a
# collision -- or a move of its own port -- keeps down.

[[lease]]
project = "gte"
name    = "console"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 8080
granted = 2026-09-01

