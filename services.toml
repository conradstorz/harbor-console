# The incumbent on 8090. Undeclared until this entry: an ordinary container from
# the sibling project Internet_Schminternet, publishing 0.0.0.0:8090->8080/tcp.
# `project` is its container name, which is what lets the port-mismatch rule
# recognise it later; `granted` is the day it was recorded, not the day it
# started listening, which is earlier and unknown.
[[lease]]
project = "schminternet"
name    = "web"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 8090
granted = 2026-09-02
