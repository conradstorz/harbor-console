# Harbor Console port ledger. Written by `harbor-console ports sync`.
# The authority on which project holds which (host, addr, port).
#
# Adopted 2026-09-01 from what was actually running on hpz440. Ports outside the
# 8100-8999 allocation band are grandfathered where they stand; nothing running is
# renumbered to tidy the band. ARM's 49152 sits inside the Linux ephemeral range
# (32768-60999) and should move when convenient.
#
# Amended by hand 2026-09-02: `schminternet` was found holding 0.0.0.0:8090, a
# port this ledger had leased to harbor-console/web while believing it free --
# the container was not running when the ledger was adopted. The incumbent keeps
# the port, which is the rule the allocator itself applies; harbor-console/web
# moved to 8100, the lowest free port in the band. Edited by hand because
# `ports sync` cannot verify host state without /ports.json, which is served by
# the very service the collision was keeping down.

[[lease]]
project = "gte"
name    = "console"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 8080
granted = 2026-09-01

[[lease]]
project = "fastapi-docker"
name    = "api"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 8000
granted = 2026-09-01

[[lease]]
project = "harbor-console"
name    = "web"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 8100
granted = 2026-09-02

[[lease]]
