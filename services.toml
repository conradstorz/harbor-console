project = "fastapi-docker"
name    = "api"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 8000
granted = 2026-09-01

[[lease]]
project = "harbor-console"
name    = "web"
host    = "hpz440"
addr    = "0.0.0.0"
port    = 80
